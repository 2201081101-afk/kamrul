<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Ambulance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚑 Ambulance Booking System</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="booking.html" class="active">Book Ambulance</a>
      <a href="contact.html">Contact</a>
      <a href="signin.html">Sign In</a>
    </nav>
  </header>

  <main>
    <section class="booking-form">
      <h2>Book an Ambulance</h2>
      <form id="ambulanceForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required>

        <label for="location">Location:</label>
        <input type="text" id="location" required>

        <label for="emergency">Emergency Type:</label>
        <select id="emergency" required>
          <option value="">Select Emergency</option>
          <option value="Accident">Accident</option>
          <option value="Heart Attack">Heart Attack</option>
          <option value="Pregnancy">Pregnancy</option>
          <option value="Other">Other</option>
        </select>

        <button type="submit">Book Now</button>
      </form>
    </section>

    <section class="booking-records">
      <h2>📋 Booking Records</h2>
      <table id="recordTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Location</th>
            <th>Emergency</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Ambulance Booking System | Emergency Hotline: 999</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
